<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Подводный мир</title>
<style>
  body, html { margin: 0; padding: 0; overflow: hidden; background: #001220; font-family: sans-serif; }
  canvas { display: block; }
  #ui { position: absolute; top: 15px; left: 15px; background: rgba(0,25,45,0.7); padding: 12px; border-radius: 8px; color: #fff; font-size: 13px; border: 1px solid rgba(255,255,255,0.2); }
  button { margin-top: 8px; padding: 5px 10px; background: #00838f; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<div id="ui">
  <b>Подводный мир</b><br>Клик — пузырьки и корм<br>
  <button onclick="init()">Новый мир</button>
</div>
<canvas id="c"></canvas>

<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let w, h, t = 0, weeds = [], fishes = [], bubbles = [], rays = [], ground = [], foods = [];
const rnd = (a, b) => Math.random() * (b - a) + a;

function resize() { w = c.width = innerWidth; h = c.height = innerHeight; }
window.onresize = () => { resize(); init(); };
resize();

class Weed {
  constructor(x) {
    this.x = x; this.seg = Math.floor(rnd(8, 16)); this.sh = rnd(12, 20);
    this.lw = rnd(5, 12); this.hue = rnd(110, 165); this.ph = rnd(0, 6.28);
  }
  draw() {
    ctx.beginPath(); ctx.moveTo(this.x, h);
    for (let i = 1; i <= this.seg; i++) {
      ctx.lineTo(this.x + Math.sin(t * 0.03 + this.ph + i * 0.3) * (i * 1.6), h - i * this.sh);
    }
    ctx.strokeStyle = `hsla(${this.hue},70%,30%,0.85)`;
    ctx.lineWidth = this.lw; ctx.lineCap = 'round'; ctx.stroke();
  }
}

class Fish {
  constructor() { this.reset(); this.x = rnd(0, w); }
  reset() {
    this.s = rnd(8, 22); this.dir = Math.random() > 0.5 ? 1 : -1;
    this.x = this.dir === 1 ? -40 : w + 40; this.y = rnd(h * 0.15, h * 0.8);
    this.sp = rnd(1, 3) * (15 / this.s); this.vx = this.sp * this.dir; this.vy = rnd(-0.3, 0.3);
    this.hue = rnd(0, 360); this.ph = rnd(0, 6.28);
  }
  update() {
    let target = null, minD = 250;
    for (let f of foods) {
      let d = Math.hypot(f.x - this.x, f.y - this.y);
      if (d < minD) { minD = d; target = f; }
    }
    if (target) {
      let a = Math.atan2(target.y - this.y, target.x - this.x);
      this.vx += Math.cos(a) * 0.15; this.vy += Math.sin(a) * 0.15;
      this.dir = this.vx >= 0 ? 1 : -1;
      if (minD < this.s) target.eaten = true;
    } else {
      this.vx += (this.sp * this.dir - this.vx) * 0.05;
      this.vy += (Math.sin(t * 0.02 + this.ph) * 0.5 - this.vy) * 0.05;
    }
    this.x += this.vx; this.y += this.vy;
    if ((this.dir === 1 && this.x > w + 50) || (this.dir === -1 && this.x < -50)) this.reset();
  }
  draw() {
    ctx.save(); ctx.translate(this.x, this.y);
    if (this.dir === -1) ctx.scale(-1, 1);
    ctx.rotate(Math.atan2(this.vy, Math.abs(this.vx)));
    ctx.fillStyle = `hsl(${this.hue},80%,55%)`;
    ctx.beginPath(); ctx.ellipse(0, 0, this.s, this.s * 0.55, 0, 0, 6.28); ctx.fill();
    let tw = Math.sin(t * 0.25 + this.ph) * (this.s * 0.4);
    ctx.beginPath(); ctx.moveTo(-this.s * 0.8, 0);
    ctx.lineTo(-this.s * 1.5, -this.s * 0.5 + tw); ctx.lineTo(-this.s * 1.5, this.s * 0.5 + tw); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(this.s * 0.5, -this.s * 0.15, this.s * 0.18, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(this.s * 0.55, -this.s * 0.15, this.s * 0.09, 0, 6.28); ctx.fill();
    ctx.restore();
  }
}

function init() {
  weeds = []; fishes = []; bubbles = []; rays = []; ground = []; foods = [];
  for (let i = 0; i <= 20; i++) ground.push({ x: (w / 20) * i, y: h - rnd(15, 60) });
  for (let i = 0; i < w / 35; i++) weeds.push(new Weed(rnd(10, w - 10)));
  for (let i = 0; i < (w * h) / 35000 + 12; i++) fishes.push(new Fish());
  for (let i = 0; i < 40; i++) bubbles.push({ x: rnd(0, w), y: rnd(0, h), r: rnd(2, 6), s: rnd(1, 3), ph: rnd(0, 6.28) });
  for (let i = 0; i < 6; i++) rays.push({ x: rnd(w * 0.1, w * 0.9), w: rnd(40, 130), a: rnd(0.15, 0.35), ph: rnd(0, 6.28) });
}

function loop() {
  t++;
  let g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#006994'); g.addColorStop(0.5, '#00334e'); g.addColorStop(1, '#001220');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  for (let r of rays) {
    let sw = Math.sin(t * 0.01 + r.ph) * 30;
    let rg = ctx.createLinearGradient(0, 0, 0, h * 0.85);
    rg.addColorStop(0, 'rgba(135,206,250,0.16)'); rg.addColorStop(1, 'rgba(135,206,250,0)');
    ctx.fillStyle = rg; ctx.beginPath();
    ctx.moveTo(r.x + sw, 0); ctx.lineTo(r.x + r.w + sw, 0);
    ctx.lineTo(r.x + r.w + h * r.a + sw, h * 0.85); ctx.lineTo(r.x + h * r.a + sw, h * 0.85); ctx.fill();
  }

  for (let wd of weeds) wd.draw();

  ctx.beginPath(); ctx.moveTo(0, h);
  for (let p of ground) ctx.lineTo(p.x, p.y);
  ctx.lineTo(w, h); ctx.fillStyle = '#041c2c'; ctx.fill();

  for (let i = foods.length - 1; i >= 0; i--) {
    let f = foods[i]; f.y += f.vy; f.x += Math.sin(t * 0.05 + f.y * 0.05) * 0.3;
    ctx.fillStyle = '#ffb74d'; ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, 6.28); ctx.fill();
    if (f.y > h - 20 || f.eaten) foods.splice(i, 1);
  }

  for (let f of fishes) { f.update(); f.draw(); }

  for (let b of bubbles) {
    b.y -= b.s; b.x += Math.sin(t * 0.05 + b.ph) * 0.6;
    if (b.y < -10) { b.y = h + 10; b.x = rnd(0, w); }
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28); ctx.stroke();
  }
  requestAnimationFrame(loop);
}

c.onmousedown = e => {
  for (let i = 0; i < 6; i++) bubbles.push({ x: e.clientX + rnd(-15, 15), y: e.clientY + rnd(-15, 15), r: rnd(2, 6), s: rnd(1, 3), ph: rnd(0, 6.28) });
  if (bubbles.length > 90) bubbles.splice(0, 6);
  for (let i = 0; i < 4; i++) foods.push({ x: e.clientX + rnd(-15, 15), y: e.clientY + rnd(-15, 15), vy: rnd(0.4, 1), eaten: false });
};

init(); loop();
</script>
</body>
</html>
